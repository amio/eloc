name: Publish Package

on:
  push:
    tags:
      - 'v*' # Trigger on version tags, e.g., v1.0.0

permissions:
  id-token: write # Required for OIDC
  contents: write # Allows checking out the repository code and creating releases

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org' # Specifies the npm registry
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build --if-present
      - run: npm test
      - name: Determine npm dist-tag
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          NPM_DIST_TAG=$(printf '%s\n' "$PACKAGE_VERSION" | sed -nE 's/^[^-]+-([A-Za-z][0-9A-Za-z-]*).*/\1/p')
          if [ -z "$NPM_DIST_TAG" ]; then
            NPM_DIST_TAG=latest
            IS_PRERELEASE=false
          else
            IS_PRERELEASE=true
          fi
          echo "PACKAGE_VERSION=$PACKAGE_VERSION" >> "$GITHUB_ENV"
          echo "NPM_DIST_TAG=$NPM_DIST_TAG" >> "$GITHUB_ENV"
          echo "IS_PRERELEASE=$IS_PRERELEASE" >> "$GITHUB_ENV"
      - name: Publish package
        run: |
          unset NODE_AUTH_TOKEN
          unset NPM_TOKEN
          echo "Publishing $PACKAGE_VERSION with dist-tag $NPM_DIST_TAG"
          npm publish --tag "$NPM_DIST_TAG"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$IS_PRERELEASE" = "true" ]; then
            echo "Creating prerelease for $GITHUB_REF_NAME"
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --prerelease
          else
            echo "Creating release for $GITHUB_REF_NAME"
            gh release create "$GITHUB_REF_NAME" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes
          fi
